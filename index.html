<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natural Wellness — Sabiduría Ancestral & Bienestar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dew: '#91B3BC',
            rain: '#5B7D87',
            currant: '#45415E',
            slate: '#2B4251',
            creosote: '#2E323C',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #2E323C; color: #91B3BC; }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-between">
  <header class="border-b border-dew/20 bg-slate/90 p-4 sticky top-0 z-40 backdrop-blur-md flex justify-between items-center max-w-6xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-rain flex items-center justify-center text-creosote font-bold">🪷</div>
      <div>
        <h1 class="text-xl font-bold text-dew">Natural Wellness</h1>
        <p class="text-xs text-rain">Sabiduría Ancestral & Salud Integrativa</p>
      </div>
    </div>
    <a href="#salas" class="rounded-full bg-rain px-4 py-2 text-xs font-semibold text-creosote hover:bg-dew">Reservar Salas</a>
  </header>

  <main class="max-w-6xl mx-auto p-4 w-full">
    <section class="rounded-3xl bg-slate p-6 my-6 ring-1 ring-dew/20">
      <span class="rounded-full bg-currant px-3 py-1 text-xs font-semibold text-dew">Videoteca Gratuita</span>
      <h2 class="text-3xl font-bold text-dew mt-2">Nutrición, Movimiento y Mente en Armonía</h2>
    </section>

    <!-- Filtros -->
    <div class="flex gap-2 overflow-x-auto pb-4">
      <button onclick="alert('Filtrando...')" class="rounded-full border border-dew/25 bg-creosote px-4 py-2 text-xs text-dew">🥗 Cocina Saludable</button>
      <button onclick="alert('Filtrando...')" class="rounded-full border border-dew/25 bg-creosote px-4 py-2 text-xs text-dew">🏋️‍♀️ Ejercicios Adaptados</button>
      <button onclick="alert('Filtrando...')" class="rounded-full border border-dew/25 bg-creosote px-4 py-2 text-xs text-dew">🧘‍♂️ Meditación & Sabiduría</button>
    </div>
  </main>

  <footer class="border-t border-dew/15 bg-creosote py-6 text-center text-xs text-dew/60">
    Natural Wellness · Plataforma Integrada con LAWENMOLL
  </footer>
</body>
</html>
